.top a{color:#e3c565;text-decoration:none;font-weight:700}

main{max-width:900px;margin:0 auto;padding:18px 16px 110px}
.box{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px 16px;margin:12px 0}

 (a.photo?'<img src="'+esc(a.photo)+'">':'')+'<label>Фото<input type="file" accept="image/*" data-a="nphoto" data-i="'+i+'"></label>'+
 '<label>Порядок (меньше — выше)'+inp(p+'.sort',0,'number')+'</label><div class="acts"><button class="gold" data-a="nsave" data-i="'+i+'">Сохранить</button>'+(a.photo?'<button class="ghost" data-a="nrm" data-i="'+i+'">Убрать фото</button>':'')+'<button class="danger" data-a="ndel" data-i="'+i+'">Удалить</button></div></div>'}).join('')+'<button data-a="nadd">+ Добавить достижение</button>'},

 '<b>Название категории</b>'+tri(p+'.n')+

 '<button class="ghost" data-a="qadd" data-i="'+i+'">+ Вопрос</button>'+

function render(){document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});$('main').innerHTML=V[tab]();trNode($('main'))}
async function saveKey(k){var r=await db.from('site_content').upsert({key:k,value:S[k],updated_at:new Date().toISOString()});if(r.error)throw r.error}
function resize(f,max,type){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(ok,type,.85)};im.onerror=no;im.src=URL.createObjectURL(f)})}
async function upload(f,max,type){var b=await resize(f,max,type),n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+(type==='image/png'?'.png':'.jpg'),r=await db.storage.from('site-media').upload(n,b,{contentType:type});if(r.error)throw r.error;return db.storage.from('site-media').getPublicUrl(n).data.publicUrl}
function delFile(u){if(u&&u.indexOf('/site-media/')>0)db.storage.from('site-media').remove([u.split('/site-media/')[1]])}
function blank3(){return ['','','']}

$('main').addEventListener('input',function(e){var p=e.target.dataset.p;if(p)set(p,e.target.type==='number'?(+e.target.value||0):e.target.value)});
$('main').addEventListener('change',async function(e){var t=e.target,a=t.dataset.a;if(t.type!=='file'||!t.files[0])return;
  try{toast('Загрузка…');if(a==='nphoto'){var i=+t.dataset.i;delFile(S.ach[i].photo);S.ach[i].photo=await upload(t.files[0],1400,'image/jpeg');await db.from('achievements').update({photo:S.ach[i].photo}).eq('id',S.ach[i].id)}
  if(a==='logoup'){S.site.logo=await upload(t.files[0],400,'image/png')}
  render();toast(a==='logoup'?'Логотип загружен — нажмите «Сохранить»':'Фото загружено ✓')}catch(x){toast('Ошибка: '+(x.message||x),1)}});
$('main').addEventListener('click',async function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;var a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j,sv=S.services;
  try{
  if(a==='save'){for(var k of b.dataset.k.split(','))await saveKey(k);return toast('Сохранено ✓')}
  if(a==='reset'){if(!confirm(tr('Вернуть стандартные значения? (потом нажмите «Сохранить» или оставьте как есть)')))return;for(var k2 of b.dataset.k.split(','))await db.from('site_content').delete().eq('key',k2);await load();render();return toast('Сброшено')}
  if(a==='up'||a==='down'){var n=a==='up'?i-1:i+1;if(n<0||n>=sv.length)return;var t=sv[i];sv[i]=sv[n];sv[n]=t;op=n}
  else if(a==='sdel'){if(!confirm(tr('Удалить услугу')+' «'+sv[i].n+'»? '+tr('Нажмите потом «Сохранить».')))return;sv.splice(i,1);op=-1}
  else if(a==='sadd'){sv.push({id:'s'+Date.now().toString(36),n:'',s:blank3(),sub:blank3(),why:blank3(),fmt:[],prep:blank3()});op=sv.length-1}
  else if(a==='fadd'){sv[i].fmt=sv[i].fmt||[];sv[i].fmt.push(blank3());op=i}
  else if(a==='fdel'){sv[i].fmt.splice(j,1);op=i}
  else if(a==='cadd'){S.faq.push({id:'c'+Date.now().toString(36),n:blank3(),items:[]});op=S.faq.length-1}
  else if(a==='cdel'){if(!confirm(tr('Удалить категорию')+' «'+(S.faq[i].n[1]||S.faq[i].n[0]||'')+'»? '+tr('Нажмите потом «Сохранить».')))return;S.faq.splice(i,1);op=-1}
  else if(a==='cup'||a==='cdn'){var cn=a==='cup'?i-1:i+1;if(cn<0||cn>=S.faq.length)return;var ct=S.faq[i];S.faq[i]=S.faq[cn];S.faq[cn]=ct;op=cn}
  else if(a==='qadd'){S.faq[i].items.push({q:blank3(),a:blank3()});op=i}
  else if(a==='qdel'){S.faq[i].items.splice(j,1);op=i}
  else if(a==='qup'||a==='qdn'){var its=S.faq[i].items,qn=a==='qup'?j-1:j+1;if(qn<0||qn>=its.length)return;var qt=its[j];its[j]=its[qn];its[qn]=qt;op=i}
  else if(a==='ladd')S.contacts.links.push({label:'',url:'https://'});
  else if(a==='ldel')S.contacts.links.splice(i,1);
  else if(a==='aadd')S.addresses.push({t:blank3(),q:''});
  else if(a==='adel')S.addresses.splice(i,1);
  else if(a==='logoreset')S.site.logo='';
  else if(a==='nadd'){var r=await db.from('achievements').insert({name:'',result:'',text:blank3(),sort:S.ach.length}).select().single();if(r.error)throw r.error;S.ach.push(r.data)}
  else if(a==='nsave'){var x=S.ach[i],r2=await db.from('achievements').update({name:x.name,result:x.result,text:x.text,photo:x.photo,sort:x.sort}).eq('id',x.id);if(r2.error)throw r2.error;return toast('Сохранено ✓')}
  else if(a==='nrm'){delFile(S.ach[i].photo);S.ach[i].photo='';await db.from('achievements').update({photo:''}).eq('id',S.ach[i].id)}
  else if(a==='ndel'){if(!confirm(tr('Удалить это достижение?')))return;delFile(S.ach[i].photo);await db.from('achievements').delete().eq('id',S.ach[i].id);S.ach.splice(i,1)}
  else if(a==='pass'){var pw=$('np').value;if(pw.length<6)return toast('Минимум 6 символов',1);var r3=await db.auth.updateUser({password:pw});if(r3.error)throw r3.error;$('np').value='';return toast('Пароль изменён ✓')}
  render()}catch(x){toast('Ошибка: '+(x.message||x),1)}});
document.querySelector('nav').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;op=-1;render();scrollTo(0,0)}};
$('out').onclick=async function(){await db.auth.signOut();location.reload()};
async function start(){$('login').hidden=true;$('app').hidden=false;try{await load();render()}catch(x){toast('Ошибка загрузки: '+(x.message||x),1)}}
$('lf').onsubmit=async function(e){e.preventDefault();$('le').textContent='';if(!db)return;var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(r.error)$('le').textContent=tr('Неверный email или пароль');else start()};
setUL(UL);
if(!db)$('le').textContent=tr('Заполните SB_URL и SB_KEY в файле config.js');
else db.auth.getSession().then(function(r){if(r.data.session)start()});
