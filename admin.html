/* FAQ: стандартные вопросы и тексты. Всё редактируется в админке → вкладка FAQ. Порядок языков: [AZ, RU, EN] */
var DEF_FAQ=[
{id:'c1',n:['Kurslar və format','Курсы и формат','Courses and format'],items:[
{q:['Dərslər onlayn, yoxsa oflayn keçirilir? Onları birləşdirmək olar?','Занятия онлайн или офлайн? Можно ли совмещать?','Are lessons online or offline? Can I combine both?'],
 a:['Formatı sizə uyğun seçirik: onlayn, oflayn və ya hər ikisini birləşdirmək mümkündür. Bizə yazın — sizin üçün hansının daha rahat olduğunu məsləhət görək.','Формат подбираем под вас: можно заниматься онлайн, офлайн или совмещать оба варианта. Напишите нам — подскажем, что удобнее в вашем случае.','We choose the format to suit you: online, offline, or a mix of both. Message us and we\u2019ll help you pick what works best.']},
{q:['Kurs nə qədər davam edir və həftədə neçə dərs olur?','Сколько длится курс и сколько занятий в неделю?','How long is the course and how many lessons per week?'],
 a:['Müddət və dərslərin sayı kursdan, səviyyənizdən və hədəf balınızdan asılıdır. Səviyyənizi müəyyənləşdirdikdən sonra dəqiq cədvəl təklif edəcəyik.','Длительность и количество занятий зависят от курса, вашего уровня и целевого балла. Точный график предложим после определения вашего уровня.','Duration and lessons per week depend on the course, your level and your target score. We\u2019ll suggest an exact schedule once we know your level.']},
{q:['Qruplar neçə nəfərlikdir? Fərdi dərslər də var?','Какого размера группы? Индивидуальные занятия тоже есть?','How big are the groups? Are there one-to-one lessons?'],
 a:['Həm qrup, həm də fərdi dərslər üzrə işləyirik. Qrupun ölçüsü barədə bizdən dəqiqləşdirin — uyğun variantı seçək.','Мы работаем и с группами, и индивидуально. Размер групп уточняйте у нас — подберём подходящий вариант.','We work with both groups and individual students. Ask us about group sizes and we\u2019ll find the right option for you.']},
{q:['Dərsləri kim aparır, müəllimlərin sertifikatları varmı?','Кто ведёт занятия и есть ли у преподавателей сертификаты?','Who teaches the lessons and do the teachers hold certificates?'],
 a:['Dərsləri akademiyanın müəllimləri aparır. Müəllimlərin təcrübəsi və sertifikatları barədə müraciət zamanı ətraflı məlumat verərik.','Занятия ведут преподаватели академии. Об опыте и сертификатах преподавателей расскажем подробнее при обращении.','Lessons are taught by the academy\u2019s teachers. Contact us and we\u2019ll tell you more about their experience and certificates.']},
{q:['Sınaq dərsi varmı?','Есть ли пробное занятие?','Is there a trial lesson?'],
 a:['Sınaq dərsinin mövcudluğu və şərtləri barədə bizdən soruşun — WhatsApp-da cavab verərik.','Наличие и условия пробного занятия уточняйте у нас — ответим в WhatsApp.','Ask us about trial lessons and their terms \u2014 we\u2019ll reply on WhatsApp.']}
]},
{id:'c2',n:['Səviyyə və hazırlıq','Уровень и подготовка','Level and preparation'],items:[
{q:['Sıfırdan başlayıram, kurs mənə uyğundurmu?','Я начинаю с нуля, подойдёт ли мне курс?','I\u2019m starting from zero \u2014 is the course right for me?'],
 a:['Bəli, istənilən səviyyədən başlamaq olar. Cari səviyyənizi müəyyənləşdirdikdən sonra sizə uyğun proqram seçirik.','Да, начать можно с любого уровня. После определения вашего текущего уровня подберём подходящую программу.','You can start at any level. Once we know where you are now, we\u2019ll pick the right programme.']},
{q:['Hazırkı səviyyəmi necə müəyyən edə bilərəm?','Как понять, какой уровень у меня сейчас?','How can I find out my current level?'],
 a:['Bizə yazın — səviyyənizi müəyyənləşdirməyə kömək edək və uyğun qrup və ya proqram seçək.','Напишите нам — поможем определить уровень и подберём подходящую группу или программу.','Message us \u2014 we\u2019ll help you determine your level and choose a suitable group or programme.']},
{q:['IELTS və ya TOEFL-a lazımi bala hazırlaşmaq üçün nə qədər vaxt lazımdır?','Сколько времени нужно, чтобы подготовиться к IELTS или TOEFL на нужный балл?','How long does it take to prepare for IELTS or TOEFL at the score I need?'],
 a:['Müddət hazırkı səviyyənizdən və hədəf baldan asılıdır. Fərq nə qədər böyükdürsə, bir o qədər çox vaxt lazım olur; dəqiq qiymətləndirməni səviyyənizi müəyyənləşdirdikdən sonra veririk.','Срок зависит от вашего текущего уровня и нужного балла. Чем больше разрыв, тем больше времени потребуется — точную оценку дадим после определения уровня.','It depends on your current level and target score. The bigger the gap, the more time you need; we\u2019ll give an accurate estimate once we know your level.']},
{q:['Proqrama nələr daxildir: yalnız testlər, yoxsa danışıq praktikası da?','Что входит в программу: только тесты или ещё разговорная практика?','What does the programme include: only tests, or speaking practice too?'],
 a:['Hazırlıq imtahanın bütün hissələrini — Listening, Reading, Writing və Speaking, o cümlədən danışıq praktikasını — əhatə edir.','Подготовка охватывает все части экзамена — Listening, Reading, Writing и Speaking, включая разговорную практику.','Preparation covers all parts of the exam \u2014 Listening, Reading, Writing and Speaking, including speaking practice.']}
]},
{id:'c3',n:['İmtahanlar','Экзамены','Exams'],items:[
{q:['İmtahana qeydiyyatda kömək edirsiniz?','Помогаете ли вы с регистрацией на экзамен?','Do you help with exam registration?'],
 a:['Bizdən soruşun — lazımi imtahana harada və necə qeydiyyatdan keçməyi izah edərik.','Спросите у нас — подскажем, где и как зарегистрироваться на нужный экзамен.','Ask us \u2014 we\u2019ll explain where and how to register for the exam you need.']},
{q:['Real imtahan formatında sınaq testləri varmı?','Есть ли пробные тесты в формате реального экзамена?','Are there mock tests in the real exam format?'],
 a:['Real format üzrə sınaq testləri hazırlığın vacib hissəsidir. Format və cədvəl barədə bizdən dəqiqləşdirin.','Пробные тесты в формате экзамена — важная часть подготовки. Подробности о формате и расписании уточняйте у нас.','Mock tests in the real exam format are an important part of preparation. Ask us for details on format and schedule.']},
{q:['Lazımi bal toplaya bilməsəm nə etməliyəm?','Что делать, если не набрал нужный балл?','What if I don\u2019t reach the score I need?'],
 a:['Bizimlə əlaqə saxlayın — nəticəni müzakirə edib növbəti addımları, o cümlədən əlavə dərsləri müəyyənləşdirək.','Свяжитесь с нами — обсудим результат и определим дальнейшие шаги, включая дополнительные занятия.','Contact us \u2014 we\u2019ll go through your result and plan next steps, including extra lessons.']},
{q:['SAT üçün: ABŞ-a qəbul sənədlərinin hazırlanmasında kömək edirsiniz?','Для SAT: поможете ли с документами для поступления в США?','For SAT: do you help prepare documents for US admission?'],
 a:['SAT və sənədlər üzrə sizin vəziyyətinizdə hansı köməyi göstərə biləcəyimizi bizdən soruşun.','Уточните у нас, какую помощь по SAT и документам мы можем предложить в вашем случае.','Ask us what help with SAT and documents we can offer in your case.']}
]},
{id:'c4',n:['Ödəniş və şərtlər','Оплата и условия','Payment and terms'],items:[
{q:['Kursun qiyməti nə qədərdir və hissə-hissə ödəniş varmı?','Сколько стоит курс и есть ли рассрочка?','How much does a course cost and is there an instalment plan?'],
 a:['Qiymət kursdan və formatdan asılıdır. Bizə yazın — qiymətlər və ödəniş şərtləri, o cümlədən hissə-hissə ödəniş imkanı barədə məlumat verək.','Стоимость зависит от курса и формата. Напишите нам — расскажем о ценах и условиях оплаты, включая возможность рассрочки.','The price depends on the course and format. Message us for prices and payment terms, including instalment options.']},
{q:['Kurs uyğun gəlməsə, pulu geri almaq olarmı?','Можно ли вернуть деньги, если курс не подошёл?','Can I get a refund if the course doesn\u2019t suit me?'],
 a:['Geri qaytarma şərtləri barədə qeydiyyatdan əvvəl bizdən dəqiq öyrənə bilərsiniz.','Условия возврата можно уточнить у нас до записи на курс.','You can check the refund terms with us before enrolling.']},
{q:['Hansı ödəniş üsulları mövcuddur və endirimlər varmı?','Какие способы оплаты доступны и есть ли скидки?','Which payment methods are available and are there discounts?'],
 a:['Ödəniş üsulları və mövcud endirimlər (qruplar, tələbələr, təkrar qeydiyyat üçün) barədə bizdən soruşun.','О способах оплаты и действующих скидках (для групп, студентов, при повторной записи) спрашивайте у нас.','Ask us about payment methods and available discounts (for groups, students or re-enrolment).']}
]},
{id:'c5',n:['Duolingo və General English','Duolingo и General English','Duolingo and General English'],items:[
{q:['Duolingo English Test lazımdır, yoxsa bu ayrı hazırlıqdır?','Нужен ли вам Duolingo English Test, или это отдельная подготовка?','Do I need the Duolingo English Test, or is it separate preparation?'],
 a:['Duolingo English Test üçün hazırlıq barədə bizdən soruşun — hədəfinizə uyğun proqram təklif edərik.','О подготовке к Duolingo English Test спросите у нас — предложим программу под вашу цель.','Ask us about Duolingo English Test preparation \u2014 we\u2019ll suggest a programme that fits your goal.']},
{q:['General English iş və ya səyahət üçün dil lazım olanlara uyğundurmu?','Подходит ли General English тем, кому нужен язык для работы или путешествий, а не экзамен?','Is General English suitable if I need English for work or travel, not an exam?'],
 a:['Bəli, imtahan lazım olmayanlar üçün də — iş, səyahət və gündəlik ünsiyyət üçün öyrənmək olar.','Да, экзамен для этого не нужен — язык можно учить для работы, путешествий и повседневного общения.','Yes \u2014 you don\u2019t need an exam to study with us. You can learn English for work, travel or everyday communication.']}
]},
{id:'c6',n:['Dəstək','Поддержка','Support'],items:[
{q:['Dərslər arasında müəllimlə necə əlaqə saxlaya bilərəm?','Как связаться с преподавателем между занятиями?','How can I contact my teacher between lessons?'],
 a:['Əlaqə qaydaları barədə qeydiyyat zamanı məlumat verəcəyik.','О способах связи с преподавателем расскажем при записи.','We\u2019ll explain how to stay in touch when you enrol.']},
{q:['Kurs bitdikdən sonra dərs yazılarına və materiallara çıxış var?','Есть ли доступ к записям занятий и материалам после окончания курса?','Do I get access to lesson recordings and materials after the course ends?'],
 a:['Yazılara və materiallara çıxış şərtlərini bizdən dəqiqləşdirin.','Условия доступа к записям и материалам уточняйте у нас.','Ask us about access to recordings and materials after the course.']}
]}
];

async function saveKey(k){var r=await db.from('site_content').upsert({key:k,value:S[k],updated_at:new Date().toISOString()});if(r.error)throw r.error}
function resize(f,max,type){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(ok,type,.85)};im.onerror=no;im.src=URL.createObjectURL(f)})}
async function upload(f,max,type){var b=await resize(f,max,type),n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+(type==='image/png'?'.png':'.jpg'),r=await db.storage.from('site-media').upload(n,b,{contentType:type});if(r.error)throw r.error;return db.storage.from('site-media').getPublicUrl(n).data.publicUrl}
function delFile(u){if(u&&u.indexOf('/site-media/')>0)db.storage.from('site-media').remove([u.split('/site-media/')[1]])}

$('main').addEventListener('click',async function(e){

  if(a==='harr'){var ar=get(b.dataset.l),o=b.dataset.o,ix=+b.dataset.i;hop=b.dataset.b;
    if(o==='add')ar.push(hnew(b.dataset.l));

    return render()}
  if(a==='save'){for(var k of b.dataset.k.split(','))await saveKey(k);return toast('Сохранено ✓')}

  if(a==='up'||a==='down'){var n=a==='up'?i-1:i+1;if(n<0||n>=sv.length)return;var t=sv[i];sv[i]=sv[n];sv[n]=t;op=n}

  else if(a==='sadd'){sv.push({id:'s'+Date.now().toString(36),n:'',s:blank3(),sub:blank3(),why:blank3(),fmt:[],prep:blank3()});op=sv.length-1}
  else if(a==='fadd'){sv[i].fmt=sv[i].fmt||[];sv[i].fmt.push(blank3());op=i}
  else if(a==='fdel'){sv[i].fmt.splice(j,1);op=i}
  else if(a==='cadd'){S.faq.push({id:'c'+Date.now().toString(36),n:blank3(),items:[]});op=S.faq.length-1}
  else if(a==='cdel'){if(!confirm(tr('Удалить категорию')+' «'+(S.faq[i].n[{az:0,ru:1,en:2}[UL]]||S.faq[i].n[0]||S.faq[i].n[1]||'')+'»? '+tr('Нажмите потом «Сохранить».')))return;S.faq.splice(i,1);op=-1}

  else if(a==='qadd'){S.faq[i].items.push({q:blank3(),a:blank3()});op=i}
  else if(a==='qdel'){S.faq[i].items.splice(j,1);op=i}

  else if(a==='ladd')S.contacts.links.push({label:'',url:'https://'});
  else if(a==='ldel')S.contacts.links.splice(i,1);
  else if(a==='aadd')S.addresses.push({t:blank3(),q:''});
  else if(a==='adel')S.addresses.splice(i,1);

  else if(a==='ndel'){if(!confirm(tr('Удалить это достижение?')))return;delFile(S.ach[i].photo);await db.from('achievements').delete().eq('id',S.ach[i].id);S.ach.splice(i,1)}
  else if(a==='pass'){var pw=$('np').value;if(pw.length<6)return toast('Минимум 6 символов',1);var r3=await db.auth.updateUser({password:pw});if(r3.error)throw r3.error;$('np').value='';return toast('Пароль изменён ✓')}
