<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erdman Chelsea Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a6f;--navy-d:#071a47;--gold:#c9a227;--gold-l:#e3c565;--bg:#fff;--bg2:#f4f6fb;--tx:#16213d;--mut:#55607c;--line:#dde3f0;--card:#fff;--hd:#0b2a6f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--bg2:#0e1a40;--tx:#eef1fa;--mut:#a9b3d1;--line:#22305f;--card:#101d47;--hd:#e3c565}}
:root[data-theme="dark"]{--bg:#0a1330;--bg2:#0e1a40;--tx:#eef1fa;--mut:#a9b3d1;--line:#22305f;--card:#101d47;--hd:#e3c565}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.65 'Manrope',system-ui,'Segoe UI',Arial,sans-serif}
body.lock{overflow:hidden}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.15;margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy-d);z-index:70}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--navy-d);color:#fff;border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;gap:12px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px 'Playfair Display',serif;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.lang{display:flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;font:700 13px 'Manrope',sans-serif;padding:7px 11px}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--navy-d)}
.burger{width:46px;height:46px;border:0;background:none;position:relative;border-radius:10px}
.burger i{position:absolute;left:11px;right:11px;height:3px;background:#fff;border-radius:2px;transition:transform .3s,opacity .2s,top .3s}
.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:22px}.burger i:nth-child(3){top:29px}
.burger.on i:nth-child(1){top:22px;transform:rotate(45deg);background:var(--gold-l)}
.burger.on i:nth-child(2){opacity:0}
.burger.on i:nth-child(3){top:22px;transform:rotate(-45deg);background:var(--gold-l)}
@media(max-width:520px){.brand span{display:none}}

.scrim{position:fixed;inset:0;background:rgba(4,12,38,.6);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:80}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);background:var(--navy-d);color:#fff;z-index:90;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 84px) 24px 24px;border-left:3px solid var(--gold);visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer a{display:block;padding:16px 4px;text-decoration:none;font:600 22px 'Playfair Display',serif;border-bottom:1px solid rgba(255,255,255,.12)}
.drawer a:hover,.drawer a.cur{color:var(--gold-l)}
.drawer a.cur::before{content:"";display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin-right:12px}
.drawer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:none;border:0;color:#fff;font-size:34px;line-height:1;width:44px;height:44px}

.hero{background:var(--navy);color:#fff;padding:48px 0 56px;position:relative;overflow:hidden;text-align:center}
.hero::after{content:"";position:absolute;right:-140px;top:-140px;width:400px;height:400px;border:2px solid var(--gold);border-radius:50%;opacity:.3}
.hero .wrap{position:relative;z-index:1}
.hero img{width:130px;height:130px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--gold);margin-bottom:22px}
.hero h1{font-size:clamp(30px,5vw,50px);font-weight:800;max-width:780px;margin:0 auto}
.hero p{font-size:18px;color:#dbe3fb;max-width:540px;margin:14px auto 0}

.view{display:none;padding:56px 0 72px;min-height:55vh;animation:vin .45s ease both}
.view.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.h2{font-size:clamp(28px,4vw,40px);color:var(--hd);font-weight:700}
.h2::after{content:"";display:block;width:64px;height:4px;background:var(--gold);margin-top:14px;border-radius:2px}
.lead{color:var(--mut);max-width:640px;margin:18px 0 0}

.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:34px}
.card{text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:12px;padding:26px 22px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,42,111,.18);border-top-color:var(--navy)}
.card b{display:block;font:700 28px 'Playfair Display',serif;color:var(--hd)}
.card span{display:block;font-size:15px;color:var(--mut);margin:4px 0 14px}
.card em{font-style:normal;font-weight:700;font-size:14px;color:var(--gold)}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;margin-top:30px;max-width:760px}
.box p{margin:0 0 14px}.box p:last-child{margin:0}
.ach{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.ach .c{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:20px}
.ach .c b{font:700 21px 'Playfair Display',serif;color:var(--hd)}
.empty{grid-column:1/-1;border:2px dashed var(--gold);border-radius:12px;padding:36px;text-align:center;color:var(--mut)}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;font-size:16px;border:2px solid var(--gold)}
.btn.g{background:var(--gold);color:var(--navy-d)}.btn.g:hover{background:var(--gold-l)}
.btn.o{color:var(--hd)}.btn.o:hover{background:rgba(201,162,39,.15)}
button.btn{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,30px);background:var(--navy-d);color:#fff;border:2px solid var(--gold);padding:12px 20px;border-radius:999px;font-weight:700;z-index:120;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tri{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ah{font-size:clamp(24px,3.4vw,32px);color:var(--hd);margin:46px 0 18px}
.addr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.ac{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.ac svg{width:30px;height:30px;fill:var(--gold)}
.ac p{margin:0;font-weight:600;flex:1}
.ac .btn{padding:10px 20px;font-size:15px}
.tri .btn{text-align:center;padding:15px 10px;white-space:nowrap}
.tri .btn.o{background:var(--card)}
@media(max-width:640px){.tri{grid-template-columns:1fr}}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);visibility:hidden;pointer-events:none}
.modal.on{visibility:visible;pointer-events:auto}
.modal .bg{position:absolute;inset:0;background:rgba(4,12,38,.7);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s}
.modal.on .bg{opacity:1}
.panel{position:relative;width:min(680px,100%);max-height:100%;overflow:auto;background:var(--card);color:var(--tx);border-radius:18px;border-top:6px solid var(--gold);box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;transform:translateY(40px) scale(.94);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.25,1.1)}
.modal.on .panel{opacity:1;transform:none}
.ph{background:var(--navy);color:#fff;padding:26px 64px 22px 26px}
.ph h2{font-size:clamp(28px,5vw,38px)}
.ph small{display:block;color:var(--gold-l);margin-top:4px;font-size:14px}
.pb{padding:24px 26px 28px;display:grid;gap:20px}
.pb h4{margin:0 0 6px;font-size:14px;color:var(--gold);font-weight:800}
.pb p{margin:0;font-size:16px}.pb ul{margin:0;padding-left:20px}
.cl{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1}
.cl:hover{background:var(--gold);color:var(--navy-d)}
footer{background:var(--navy-d);color:#c4cdea;padding:26px 0;text-align:center;font-size:14px;border-top:2px solid var(--gold)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.deco.fix{position:fixed}
.deco>div{position:absolute;color:#fff;opacity:.15;animation:fl 9s ease-in-out infinite}
.deco>div.g{color:var(--gold);opacity:.35}
.deco.fix>div{color:var(--gold);opacity:.14}
.deco svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.deco .w{font:italic 700 28px 'Playfair Display',Georgia,serif;white-space:nowrap}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(var(--r))}}
main,footer{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.box p,.pb p,.ach .c p,.lead{white-space:pre-line}
.ach{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ach .c img{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:12px;cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(4,12,38,.92);z-index:130;display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}

.fqc{max-width:820px}
.fq{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;margin:10px 0}
.fq summary{cursor:pointer;padding:16px 20px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--gold);font-size:26px;line-height:1;flex:none}
.fq[open] summary::after{content:"\2013"}
.fq p{margin:0;padding:0 20px 18px;color:var(--mut);white-space:pre-line}
.fqc .ah{margin-top:38px}
.fcta{margin-top:36px;text-align:center}

/* ===== home page sections ===== */
[hidden]{display:none!important}
#v-services{padding-bottom:0}
#svc-sec{scroll-margin-top:90px}
.hero .btns{justify-content:center;margin-top:26px}
.hero .btn.o,.band .btn.o{color:#fff}
.hero .btn.o:hover,.band .btn.o:hover{background:rgba(255,255,255,.12)}
.sec{padding:64px 0}
.sec.alt{background:var(--bg2)}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap}
.more{font-weight:700;color:var(--hd);text-decoration:none;border-bottom:2px solid var(--gold);padding-bottom:2px;white-space:nowrap}
.more::after{content:" \2192"}
.more:hover{border-bottom-color:var(--hd)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:34px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;transition:transform .25s,box-shadow .25s}
.feat:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(11,42,111,.14)}
.feat i{display:grid;place-items:center;width:54px;height:54px;border-radius:15px;background:var(--navy);box-shadow:0 0 0 3px var(--gold) inset;margin-bottom:16px}
.feat svg{width:28px;height:28px;fill:none;stroke:var(--gold-l);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.feat h3{font-size:21px;color:var(--hd);margin-bottom:8px}
.feat p{margin:0;font-size:15px;color:var(--mut)}
.abt{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;gap:14px}
.stat{background:var(--navy);color:#fff;border-radius:14px;border-left:6px solid var(--gold);padding:18px 22px;display:flex;align-items:center;gap:18px}
.stat b{font:800 44px/1 'Playfair Display',serif;color:var(--gold-l);min-width:64px}
.stat span{font-size:15px;color:#dbe3fb;line-height:1.35}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:34px}
.st{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:58px 22px 24px;overflow:hidden}
.st .n{position:absolute;top:10px;left:18px;font:800 54px/1 'Playfair Display',serif;color:var(--gold);opacity:.55}
.st h3{font-size:21px;color:var(--hd);margin-bottom:6px}
.st p{margin:0;font-size:15px;color:var(--mut)}
.hp{margin-top:30px}
.hp .c img{aspect-ratio:4/3;object-fit:cover}
#hfaq{margin-top:26px}
.band{background:var(--navy-d);color:#fff;text-align:center;padding:64px 0;border-top:3px solid var(--gold)}
.band h2{font-size:clamp(28px,4.4vw,42px);color:#fff}
.band p{color:#c4cdea;max-width:520px;margin:14px auto 0}
.band .btns{justify-content:center;margin-top:26px}
@media(max-width:760px){.abt{grid-template-columns:1fr;gap:28px}.sec{padding:48px 0}}
</style>
</head>
